name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatage
        run: npm run format:check
      - name: Types (application et logique sans DOM)
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
